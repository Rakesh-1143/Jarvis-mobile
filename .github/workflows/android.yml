name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      JARVIS_START_URL:
        description: "Optional HTTPS URL compiled into the WebView APK"
        required: false
        type: string
        default: "https://rakesh-1143.github.io/Jarvis-mobile/frontend/"

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"

      - name: Load fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret JARVIS_KEYSTORE_BASE64 is missing. Without it each build gets a new key and phones show 'App not installed'."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis.keystore"
          echo "JARVIS_KEYSTORE_FILE=$RUNNER_TEMP/jarvis.keystore" >> "$GITHUB_ENV"

      - name: Get sherpa-onnx (offline "my voice" engine)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 5 -o "$RUNNER_TEMP/sherpa.aar" https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.33/sherpa-onnx-1.12.33.aar
          echo "9b07a0a2faec52cd6e5ee2cf4759d4ad49f5a7d1e750f24e26e9e8074c5ae2c6  $RUNNER_TEMP/sherpa.aar" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/sherpa" && mkdir "$RUNNER_TEMP/sherpa" && cd "$RUNNER_TEMP/sherpa" && unzip -q "$RUNNER_TEMP/sherpa.aar"
          # Keep only the JNI library for arm ABIs (the app ships arm64 only unless JARVIS_ABIS says otherwise); it uses the app's own libonnxruntime.so.
          rm -rf jni/x86 jni/x86_64 jni/*/libonnxruntime.so jni/*/libsherpa-onnx-c-api.so jni/*/libsherpa-onnx-cxx-api.so
          mkdir -p "$GITHUB_WORKSPACE/android/app/libs"
          rm -f "$GITHUB_WORKSPACE/android/app/libs/sherpa-onnx.aar"
          zip -qr "$GITHUB_WORKSPACE/android/app/libs/sherpa-onnx.aar" .
          unzip -l "$GITHUB_WORKSPACE/android/app/libs/sherpa-onnx.aar" | grep jni/

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      # Release build: smaller (unused library code removed), faster, and not debuggable.
      # Same fixed signing key as before, so phones still show "Update".
      - name: Build APK
        env:
          JARVIS_START_URL: ${{ inputs.JARVIS_START_URL || 'https://rakesh-1143.github.io/Jarvis-mobile/frontend/' }}
          # Always bigger than the last build, so phones offer "Update".
          JARVIS_VERSION_CODE: ${{ github.run_number }}0${{ github.run_attempt }}
        run: gradle --no-daemon assembleRelease -PJARVIS_START_URL="$JARVIS_START_URL" -PJARVIS_VERSION_CODE="$JARVIS_VERSION_CODE"

      - name: Check APK signature, version and size
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | head -1
          if "$BT/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then echo "::error::APK is debuggable"; exit 1; fi
          ls -l "$APK"
          unzip -l "$APK" | grep -E "lib/|classes" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # Name kept so existing install steps still find it; the file inside is now the release APK.
          name: jarvis-debug-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
